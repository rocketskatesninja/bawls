name: ci

# Every push and pull request runs the checks. A version tag (v1.2.3) also
# builds the release tarball (with vendor/ and public/build, so servers need
# neither Composer nor Node) and publishes it as a GitHub release.

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, mbstring, xml, curl
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      # The app refuses to boot without a sign-in slug, and composer install
      # boots it (package:discover), so the .env comes first.
      - name: App environment
        run: |
          cp .env.example .env
          sed -i 's/^BAWLS_LOGIN_PATH=.*/BAWLS_LOGIN_PATH=ci-console/' .env

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci
          php artisan key:generate --no-interaction

      # The pages render with the Vite manifest, so build before testing.
      - name: Build assets
        run: npm run build

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: PHP tests
        run: php artisan test --compact

      - name: Sensor tests
        working-directory: sensors
        run: pipx run pytest -q

      - name: Installer scripts (ShellCheck)
        run: shellcheck --severity=warning install.sh deploy/build-release.sh

      - name: Security audits
        run: |
          composer audit --no-interaction
          npm audit --omit=dev --audit-level=high

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, mbstring, xml, curl
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Build the release
        run: deploy/build-release.sh

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/bawls-* \
            --title "bawls $GITHUB_REF_NAME" --generate-notes
