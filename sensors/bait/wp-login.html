<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log In — WordPress</title><style>:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 Georgia,'Times New Roman',serif;color:#1c2330;background:#eef1f6}
a{color:#1a4f8b;text-decoration:none}a:hover{text-decoration:underline}
header.site{background:#0b2a4a;color:#fff;border-bottom:4px solid #e8b004}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}
.bar{display:flex;align-items:center;gap:14px;padding:14px 0}
.logo{width:26px;height:26px;border:2px solid #e8b004;border-radius:50%}
.brand{font-weight:bold;letter-spacing:.14em;font-size:19px}
nav a{color:#cfe0f3;margin-left:16px;font-size:13px;font-family:Arial,sans-serif}
.hero{background:#14365c;color:#fff;padding:40px 0}
.hero h1{margin:0 0 6px;font-size:28px}
.hero p{margin:0;color:#b9cde3}
main{padding:30px 0}
h2{color:#0b2a4a;border-bottom:1px solid #d3d9e3;padding-bottom:6px}
.card{background:#fff;border:1px solid #d3d9e3;border-radius:4px;padding:16px 18px;margin:14px 0}
.price{color:#0b2a4a;font-weight:bold}
.muted{color:#5a6678;font-size:13px}
label{display:block;margin:10px 0 3px;font-size:13px;font-family:Arial,sans-serif}
input,textarea{width:100%;padding:7px;border:1px solid #b9c2d0;border-radius:3px;font:inherit}
button{margin-top:12px;background:#0b2a4a;color:#fff;border:0;padding:9px 18px;border-radius:3px;cursor:pointer}
footer.site{border-top:1px solid #d3d9e3;margin-top:30px;padding:18px 0;color:#5a6678;font-size:12px;font-family:Arial,sans-serif}
.err{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b2a4a;color:#eef1f6;text-align:center}
.err .code{font-size:60px;color:#e8b004;margin:0}
.err p{color:#b9cde3}</style></head>
<body><main><div class="wrap" style="max-width:360px;margin-top:60px">
<div class="card"><h2 style="border:0;margin-top:0">Log In — WordPress</h2>
<form method="post" action="/wp-login.php"><input type="hidden" name="redirect_to" value="/wp-admin/">
<label>Username</label><input name="log" autocomplete="username">
<label>Password</label><input name="pwd" type="password" autocomplete="current-password">
<button type="submit">Log In</button></form></div></div></main></body></html>
