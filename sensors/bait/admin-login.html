<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administration</title><style>:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 Georgia,'Times New Roman',serif;color:#1c2330;background:#eef1f6}
main{padding:30px 0}
.wrap{max-width:360px;margin:60px auto 0;padding:0 20px}
.card{background:#fff;border:1px solid #d3d9e3;border-radius:4px;padding:16px 18px;margin:14px 0}
h2{color:#0b2a4a;margin-top:0;padding-bottom:6px}
label{display:block;margin:10px 0 3px;font-size:13px;font-family:Arial,sans-serif}
input{width:100%;padding:7px;border:1px solid #b9c2d0;border-radius:3px;font:inherit}
button{margin-top:12px;background:#0b2a4a;color:#fff;border:0;padding:9px 18px;border-radius:3px;cursor:pointer}</style></head>
<body><main><div class="wrap">
<div class="card"><h2>Administration</h2>
<form method="post" action="/login">
<label>Username</label><input name="log" autocomplete="username">
<label>Password</label><input name="pwd" type="password" autocomplete="current-password">
<button type="submit">Log In</button></form></div></div></main></body></html>
