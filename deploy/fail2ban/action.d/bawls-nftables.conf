# /etc/fail2ban/action.d/bawls-nftables.conf
#
# fail2ban's own nftables action, with one change: the IPv6 set is made for
# ranges ("flags interval"). bawls bans an IPv6 attacker as a whole /64, and
# nftables refuses a prefix in an ordinary set. Only the bawls jail uses this;
# other jails keep the stock action.

[INCLUDES]
before = nftables.conf

[Init?family=inet6]
addr_type = ipv6_addr\; flags interval
