# /etc/fail2ban/filter.d/bawls.conf
#
# Matches the ban requests bawls appends to storage/logs/ban.log
# (App\Services\Blocklist::ban), e.g.
#   2026-11-18T04:34:39Z bawls ban 203.0.113.7 rule=web_exploit alert=42
# The ISO-8601 UTC stamp is found by fail2ban's default date detection.
# Check with: fail2ban-regex /var/www/bawls/storage/logs/ban.log /etc/fail2ban/filter.d/bawls.conf

[Definition]
failregex = ^\s*bawls ban <ADDR> rule=
ignoreregex =
